name: Android APK Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies (raiz do monorepo)
        run: npm install

      - name: Gerar projeto nativo Android
        working-directory: frontend-mobile
        run: npx expo prebuild --platform android --non-interactive

      - name: Build do APK de release
        working-directory: frontend-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanOS-APK-Release
          path: frontend-mobile/android/app/build/outputs/apk/release/app-release.apk
